<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a41">
<link rel="manifest" href="manifest.json">
<title>워크가이드</title>
<style>
:root{--bg:#f6f4ef;--fg:#1b2a41;--card:#fff;--accent:#c1440e;--muted:#6b7280}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--fg:#eef0f3;--card:#1b2431;--muted:#9aa4b2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:1.3rem;margin:.2em 0}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;border:0;border-radius:12px;padding:14px;background:var(--accent);color:#fff;width:100%;margin:6px 0}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--muted)}
.row{display:flex;gap:8px}.row>*{flex:1}
select,input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--muted);background:var(--card);color:var(--fg);width:100%}
#status,#answer{white-space:pre-wrap}
.muted{color:var(--muted);font-size:.9rem}
li{margin:.3em 0}
</style>
</head>
<body>
<h1>🎧 워크가이드</h1>
<p class="muted">걷다가 물어보세요. "오른쪽 건물 뭐야?"</p>

<div class="card"><div id="status" class="muted">시작을 눌러 위치·나침반 권한을 허용하세요.</div></div>

<button id="start">▶ 시작 (자동 안내 켜기)</button>
<button id="mic" class="sec">🎤 말로 질문하기</button>
<label class="sec" style="display:block;text-align:center;border-radius:12px;padding:14px;margin:6px 0;border:1px solid var(--muted)">📷 사진으로 물어보기<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
<div class="row"><input id="q" placeholder="또는 입력: 왼쪽 골목에 뭐 있어?"><button id="send" style="flex:0 0 80px">전송</button></div>

<div class="card"><div id="answer">아직 안내가 없습니다.</div></div>
<div class="card"><b>주변</b><ul id="list" class="muted"></ul></div>

<div class="row">
<select id="lang"><option value="ko">한국어</option><option value="en">English</option></select>
<select id="persona"><option value="historian">역사학자</option><option value="funny">유머러스</option><option value="kid">아이용</option><option value="storyteller">이야기꾼</option><option value="insider">현지 고수</option></select>
<select id="radius"><option value="100">100m</option><option value="150" selected>150m</option><option value="300">300m</option></select>
</div>
<script src="tts.js"></script>
<script src="app.js"></script>
</body>
</html>
