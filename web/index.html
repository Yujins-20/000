<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a41">
<link rel="manifest" href="manifest.json">
<title>워크가이드</title>
<style>
:root{--bg:#f6f4ef;--fg:#1b2a41;--card:#fff;--accent:#c1440e;--muted:#6b7280;--line:#d8d3c8}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--fg:#eef0f3;--card:#1b2431;--muted:#9aa4b2;--line:#34404f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:1.3rem;margin:.2em 0}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
button,label.btn{font:inherit;border:0;border-radius:12px;padding:12px;background:var(--accent);color:#fff;width:100%;margin:5px 0;cursor:pointer;display:block;text-align:center}
.sec{background:var(--card)!important;color:var(--fg)!important;border:1px solid var(--line)!important}
.row{display:flex;gap:8px}.row>*{flex:1}
select,input[type=text]{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);width:100%;min-width:0}
.muted{color:var(--muted);font-size:.9rem}
#chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.b{padding:10px 12px;border-radius:14px;max-width:92%;white-space:pre-wrap}
.b.u{align-self:flex-end;background:var(--accent);color:#fff}
.b.g{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.b.s{align-self:center;background:transparent;color:var(--muted);font-size:.85rem}
.b.g.live::after{content:"▍";animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#chips button{width:auto;margin:0;padding:8px 12px;border-radius:99px;font-size:.92rem}
li{margin:.3em 0}
</style>
</head>
<body>
<h1>🎧 워크가이드</h1>
<p class="muted">걷다가 물어보세요. "오른쪽 건물 뭐야?" 이야기를 듣고 나면 이어서 "누가 지었어?"처럼 계속 물어볼 수 있어요.</p>

<div class="card"><div id="status" class="muted">시작을 눌러 위치·나침반 권한을 허용하세요.</div></div>
<button id="start">▶ 시작 (자동 안내 켜기)</button>

<div id="chat" class="card"><div class="b s">아직 안내가 없습니다.</div></div>
<div id="chips"></div>

<div class="card">
  <div class="row"><input type="text" id="q" placeholder="질문 입력: 오른쪽 건물 뭐야? / 누가 지었어?"><button id="send" style="flex:0 0 76px;margin:0">전송</button></div>
  <div class="row" style="margin-top:6px">
    <button id="mic" class="sec">🎤 말로 질문</button>
    <button id="stop" class="sec">⏹ 멈추기</button>
  </div>
  <label class="btn sec">📷 사진으로 물어보기<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
</div>

<div class="card"><b>주변</b><ul id="list" class="muted"></ul></div>

<div class="row">
<select id="lang"><option value="ko">한국어</option><option value="en">English</option></select>
<select id="persona"><option value="historian">역사학자</option><option value="funny">유머러스</option><option value="kid">아이용</option><option value="storyteller">이야기꾼</option><option value="insider">현지 고수</option></select>
<select id="depth" title="해설 깊이"><option value="rich">풍부하게</option><option value="grounded">자료만(엄격)</option></select>
<select id="radius"><option value="100">100m</option><option value="150" selected>150m</option><option value="300">300m</option></select>
</div>
<script src="tts.js"></script>
<script src="app.js"></script>
</body>
</html>
