<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>워크가이드 시뮬레이터</title>
<style>
:root{--bg:#f6f4ef;--fg:#1b2a41;--card:#fff;--accent:#c1440e;--muted:#6b7280;--line:#d8d3c8}
@media (prefers-color-scheme:dark){:root{--bg:#10151d;--fg:#eef0f3;--card:#1b2431;--muted:#9aa4b2;--line:#34404f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:12px 16px;max-width:760px;margin-inline:auto}
h1{font-size:1.2rem;margin:.2em 0}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
canvas{width:100%;height:auto;aspect-ratio:1/1;border-radius:12px;background:var(--card);touch-action:none;display:block}
button{font:inherit;border:0;border-radius:10px;padding:10px 12px;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.row>*{flex:1 1 auto}
input[type=text]{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);flex:3 1 200px;min-width:0}
.muted{color:var(--muted);font-size:.88rem}
#log{max-height:420px;overflow:auto}
.chip{flex:0 0 auto!important;border-radius:99px;padding:6px 12px;font-size:.88rem}
.msg{padding:8px 10px;border-radius:10px;margin:6px 0;background:var(--bg)}
.msg.u{border-left:3px solid var(--muted)}.msg.a{border-left:3px solid var(--accent)}.msg.s{border-left:3px solid #2f855a}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--bg);font-size:.8rem;color:var(--muted)}
label{display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<h1>🎧 워크가이드 시뮬레이터 <span class="pill" id="mode">서버 확인 중</span></h1>
<p class="muted">로마 콜로세움 일대. 지도를 <b>탭하면 그 위치로 순간이동</b>, 아래 버튼이나 키보드(↑↓ 걷기, ←→ 회전)로 걸으며 질문해 보세요. 80m 안으로 처음 들어오면 가이드가 먼저 이야기를 시작하고, 끝나면 <b>이어서 질문</b>("누가 지었어?")할 수 있어요. 서버의 LLM이 답합니다.</p>

<canvas id="map" width="720" height="720"></canvas>

<div class="card">
  <div class="row">
    <button class="sec" id="tl">⟲ 왼쪽 45°</button>
    <button id="fw">▲ 앞으로 20m</button>
    <button class="sec" id="bk">▼ 뒤로 20m</button>
    <button class="sec" id="tr">오른쪽 45° ⟳</button>
  </div>
  <div class="muted" id="state"></div>
</div>

<div class="card">
  <div class="row">
    <button class="sec" data-q="앞에 있는 건물 뭐야?">앞 뭐야?</button>
    <button class="sec" data-q="왼쪽에 뭐 있어?">왼쪽 뭐야?</button>
    <button class="sec" data-q="오른쪽 건물 뭐야?">오른쪽 뭐야?</button>
    <button class="sec" data-q="뒤에 뭐 있어?">뒤 뭐야?</button>
  </div>
  <div class="row">
    <input type="text" id="q" placeholder="직접 질문: 저 성당은 뭐야?">
    <button id="ask">질문</button>
    <button class="sec" id="mic">🎤</button>
  </div>
  <div class="row muted">
    <label><input type="checkbox" id="speak" checked> 음성으로 듣기</label>
    <label><input type="checkbox" id="auto" checked> 자동 안내</label>
    <label>페르소나
      <select id="persona"><option value="historian">역사학자</option><option value="funny">유머러스</option><option value="kid">아이용</option><option value="storyteller">이야기꾼</option><option value="insider">현지 고수</option></select>
    </label>
  </div>
</div>

<div class="card">
  <b>서버</b> <span class="muted" id="serverState">확인 중…</span>
  <div class="row"><input type="text" id="server" placeholder="서버 주소 — 같은 주소에서 열었다면 비워 두세요 (예: https://xxxx.trycloudflare.com)"><button id="connect">연결</button></div>
  <div class="row muted"><label>해설 깊이
    <select id="depth"><option value="rich">풍부하게 (모델 배경지식 포함)</option><option value="grounded">자료만 (엄격)</option></select></label></div>
  <div class="muted">해설(LLM)과 음성(TTS)은 서버가 만들어 줍니다. 키는 서버에만 있고 이 화면에는 입력하지 않아요. 서버 주소가 다른 도메인이면 서버의 <code>ALLOWED_ORIGINS</code> 설정이 필요합니다.</div>
</div>

<div class="card"><b>대화</b><div id="log"></div><div id="chips" class="row" style="flex-wrap:wrap"></div></div>

<script src="config.js"></script>
<script src="tts.js"></script>
<script>
// ---------- 지리 계산 (backend/app/geo.py 와 동일 로직) ----------
const R = 6371000, rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
const dist = (a,b,c,d) => { const p1=rad(a),p2=rad(c),dp=p2-p1,dl=rad(d-b);
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
const bearing = (a,b,c,d) => { const p1=rad(a),p2=rad(c),dl=rad(d-b);
  return (deg(Math.atan2(Math.sin(dl)*Math.cos(p2), Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl)))+360)%360; };
const relAngle = (b,h) => ((b-h+180)%360+360)%360-180;
const dirOf = r => Math.abs(r)<=45?'front':Math.abs(r)>=135?'back':r>0?'right':'left';
const DIR = {front:'정면', right:'오른쪽', back:'뒤쪽', left:'왼쪽'};
const KW = {left:['왼쪽','왼편','좌측','left'], right:['오른쪽','오른편','우측','right'], back:['뒤','behind','back'], front:['앞','정면','맞은편','ahead','front']};
const dirFromText = t => { t=t.toLowerCase(); for(const d of ['left','right','back','front']) if(KW[d].some(k=>t.includes(k))) return d; return null; };

/*SHARED-BEGIN*/
const SHARED = {
 "PERSONAS": {
  "historian": {
   "label": "역사학자"
  },
  "funny": {
   "label": "유머러스"
  },
  "kid": {
   "label": "아이용"
  },
  "storyteller": {
   "label": "이야기꾼"
  },
  "insider": {
   "label": "현지 고수"
  }
 },
 "FOLLOW_UPS": {
  "ko": [
   "누가, 왜 만들었어?",
   "재밌는 일화 하나만 더 들려줘",
   "여기서 뭘 눈여겨보면 좋아?",
   "주변에 또 볼 만한 곳은?",
   "그 뒤로 어떻게 변했어?",
   "사진 찍기 좋은 위치는?"
  ],
  "en": [

   "Tell me one more fun story",
   "What should I look at here?",
   "What else is nearby?",
   "How did it change over time?",

  ]
 },
 "PLACES": [
  {
   "id": "colosseum",

   "lat": 41.89021,
   "lng": 12.49223,
   "summary": "플라비우스 왕조의 베스파시아누스 황제 때인 서기 70년대 초에 공사를 시작해, 아들 티투스가 서기 80년에 개장한 로마 최대의 원형 경기장입니다. 정식 이름은 플라비우스 원형경기장이고, '콜로세움'이라는 이름은 근처에 있던 네로 황제의 거대한 동상(콜로소)에서 왔다는 설이 널리 받아들여집니다. 타원형 평면은 길이 약 190m, 높이는 약 50m에 이르고, 수용 인원은 추정이 갈리지만 5만 명 안팎으로 봅니다. 개장 기념 경기는 100일 동안 이어졌다고 전해집니다. 지하에는 맹수와 검투사가 대기하던 공간과 승강 장치가 있었고, 햇빛을 가리는 거대한 천막 지붕은 선원들이 조작했다고 알려져 있습니다. 중세에는 요새와 석재 채석장으로도 쓰였고, 지진과 약탈로 외벽 일부가 무너져 지금의 모습이 되었습니다."
  },
  {
   "id": "arch_constantine",
   "name": "콘스탄티누스 개선문",
   "lat": 41.88981,
   "lng": 12.49055,
   "summary": "서기 315년에 봉헌된, 로마에 남은 개선문 중 가장 큰 문입니다. 312년 밀비우스 다리 전투에서 콘스탄티누스 황제가 막센티우스를 이긴 것을 기념해 원로원이 세웠습니다. 높이는 약 21m이고 통로가 세 개입니다. 이 문의 흥미로운 점은 조각 상당수를 트라야누스·하드리아누스·마르쿠스 아우렐리우스 시대의 오래된 기념물에서 가져다 다시 썼다는 것입니다. 그래서 같은 문에 다른 시대의 조각 양식이 섞여 있습니다. 개선 행렬이 콜로세움 옆을 지나 포로 로마노로 향하던 길목에 서 있습니다."
  },
  {
   "id": "forum",
   "name": "포로 로마노",
   "lat": 41.89246,
   "lng": 12.48531,
   "summary": "팔라티노 언덕과 카피톨리노 언덕 사이의 골짜기에 있던 고대 로마의 중심 광장입니다. 원래는 습지에 가까웠는데 배수 시설(클로아카 막시마)로 말려 시장과 집회 장소가 되었다고 전해집니다. 원로원 의사당(쿠리아), 사투르누스 신전, 신성한 길(비아 사크라), 티투스와 셉티미우스 세베루스의 개선문 등이 모여 있었습니다. 로마가 쇠퇴하면서 땅 아래 묻혀 중세에는 소를 풀어 먹이던 곳이라 '캄포 바키노(소 들판)'로 불렸고, 본격적인 발굴은 18~19세기 이후에 진행되었습니다."
  },
  {
   "id": "san_clemente",
   "name": "산 클레멘테 대성당",
   "lat": 41.88897,
   "lng": 12.49794,
   "summary": "12세기 초에 지어진 성당 아래에 4세기 성당이 있고, 그 아래에는 1세기 건물들과 미트라 신전이 겹쳐 있는 3층 구조의 성당입니다. 위층에는 12세기 모자이크가 있고, 아래층에는 초기 기독교 시대의 프레스코와 이탈리아어 속어가 적힌 오래된 낙서가 남아 있다고 알려져 있습니다. 가장 아래층에서는 지하수가 흐르는 소리가 들린다고 해서, 시간을 거슬러 내려가는 느낌을 주는 곳으로 유명합니다."
  },
  {
   "id": "palatine",
   "name": "팔라티노 언덕",
   "lat": 41.8897,
   "lng": 12.4875,
   "summary": "로마 7개 언덕 중 가장 중심이 되는 언덕으로, 기원전 753년에 로물루스가 도시를 세웠다는 건국 전설의 무대입니다. 공화정 시대에는 부유한 귀족들이, 제정 시대에는 황제들이 궁전을 지었고, 영어의 '팰리스(궁전)'라는 단어가 이 언덕 이름 '팔라티움'에서 나왔다고 설명합니다. 아우구스투스의 집과 도미티아누스 황제의 궁전 터가 남아 있고, 언덕 위에서는 포로 로마노와 키르쿠스 막시무스 방향이 내려다보입니다."
  },
  {
   "id": "meta_sudans",
   "name": "메타 수단스 터",
   "lat": 41.88983,
   "lng": 12.49113,
   "summary": "콜로세움과 콘스탄티누스 개선문 사이에 있던 원뿔형 분수의 터입니다. 이름은 '땀 흘리는 반환점'이라는 뜻으로, 원뿔 꼭대기에서 물이 흘러내리는 모습에서 붙었다고 전해집니다. 서기 1세기 말 플라비우스 왕조 때 만들어졌고, 1930년대 도로 정비 과정에서 철거되어 지금은 둥근 터만 남아 있습니다."
  }
 ]
};
/*SHARED-END*/
const PLACES = SHARED.PLACES;

// ---------- 상태 ----------
const S = {lat:41.8896, lng:12.4895, heading:90, spoken:new Set(), radius:300, history:[], focus:null, lastTalk:0};
const ORIGIN = {lat:41.8896, lng:12.4905};
const $ = id => document.getElementById(id);

function nearby(){
  return PLACES.map(p=>{
    const d=dist(S.lat,S.lng,p.lat,p.lng), b=bearing(S.lat,S.lng,p.lat,p.lng);
    return {...p, distance_m:Math.round(d), bearing:Math.round(b), direction:dirOf(relAngle(b,S.heading))};
  }).filter(p=>p.distance_m<=S.radius).sort((a,b)=>a.distance_m-b.distance_m);
}

// ---------- 서버 연결 (해설=서버 LLM, 음성=서버 TTS. 키는 서버에만 있다) ----------
const PERSONAS = SHARED.PERSONAS;   // 표시용 이름만. 프롬프트는 서버가 가진다.
const store={get:k=>{try{return localStorage.getItem(k)||''}catch{return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let API='';                          // 같은 주소에서 열었으면 ''
function setApi(u){ API=(u||'').trim().replace(/\/+$/,''); Voice.setBase(API); store.set('wg_server',API); }
function setConn(ok){ $('mode').textContent = ok ? '서버 연결됨' : '서버 없음 (샘플 해설)'; }
async function connect(){
  $('serverState').textContent='연결 확인 중…';
  try{
    const h=await (await fetch(API+'/api/health',{signal:AbortSignal.timeout(6000)})).json();
    setConn(true);
    $('serverState').textContent=`LLM: ${h.llm}${h.llm==='mock'?' (미연결 → 샘플 응답)':''} · TTS: ${h.tts?'서버 음성':'브라우저 음성'} · 카메라(VLM): ${h.vision?'가능':'꺼짐'} · 장소: ${h.places}`;
    await loadServerPlaces();
  }catch{
    setConn(false);
    $('serverState').textContent='서버에 연결할 수 없어요. 주소·서버 상태·CORS(ALLOWED_ORIGINS)를 확인하세요.';
  }
}
async function loadServerPlaces(){   // 서버가 쓰는 장소 목록으로 지도를 맞춘다(키 없는 mock이면 같은 샘플)
  try{
    const r=await fetch(API+'/api/nearby',{method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(10000),
      body:JSON.stringify({lat:ORIGIN.lat,lng:ORIGIN.lng,radius_m:1000})});
    const ps=await r.json();
    if(Array.isArray(ps)&&ps.length){ PLACES.splice(0,PLACES.length,...ps.map(p=>({id:p.id,name:p.name,lat:p.lat,lng:p.lng,summary:p.summary}))); draw(); }
  }catch{}
}

// ---------- 대화 계획 (서버 plan_request 와 같은 규칙. 서버 없이 샘플로 대신 답할 때만 쓴다) ----------
function plan(question, placeId){
  const q=question.trim(), d=dirFromText(q), ps=nearby();
  const others=pl=>ps.filter(p=>p.id!==pl.id).slice(0,3);
  if(S.focus && q && !placeId && !d){
    const place=ps.find(p=>p.id===S.focus.id) || S.focus;
    return {mode:'followup', place, neighbors:others(place)};
  }
  if(!ps.length) return {msg:'근처에서 설명할 만한 장소를 찾지 못했어요. 조금 더 걸어 보세요.'};
  const targets = placeId ? ps.filter(p=>p.id===placeId) : d ? ps.filter(p=>p.direction===d)
    : [...ps].sort((a,b)=>(a.direction!=='front')-(b.direction!=='front')||a.distance_m-b.distance_m);
  if(!targets.length) return {msg:`${DIR[d]}에는 눈에 띄는 장소가 없어요.`};
  return {mode:'story', place:targets[0], neighbors:others(targets[0])};
}
function templateText(pl){
  const p=pl.place, n=pl.neighbors[0];
  if(pl.mode==='followup') return '서버에 연결되어 있지 않아서 자유 질문에는 답할 수 없어요. 위의 서버 주소를 확인해 주세요.';
  return `${DIR[p.direction]} ${p.distance_m}미터 앞에 보이는 곳은 ${p.name}입니다. ${p.summary}${n?` 근처 ${DIR[n.direction]}에는 ${n.name}도 있어요.`:''}`;
}

// ---------- 질문 → 서버 스트리밍 응답 (문장이 오는 즉시 표시 + 서버 TTS 큐 투입) ----------
let ctl=null;
async function ask(question, auto=false, placeId=null){
  const q=question.trim(); S.lastTalk=Date.now();
  ctl && ctl.abort(); const my=ctl=new AbortController();
  log(auto?'s':'u', (auto?'🔔 ':'')+q); chips([]);
  const persona=$('persona').value, prefix=`🎧 [${PERSONAS[persona].label}] `, el=log('a',prefix), speak=$('speak').checked;
  if(speak) Voice.start({persona}); else Voice.stop();
  let full='', meta=null;
  try{
    const r=await fetch(API+'/api/ask/stream',{method:'POST',signal:my.signal,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lat:S.lat,lng:S.lng,heading:S.heading,radius_m:S.radius,question:q,persona,depth:$('depth').value,
        place_id:placeId,history:S.history.slice(-8),focus:S.focus})});
    if(!r.ok) throw new Error(r.status);
    const reader=r.body.getReader(), dec=new TextDecoder(); let buf='';
    for(;;){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf('\n\n'))>=0){
        const line=buf.slice(0,i); buf=buf.slice(i+2);
        if(!line.startsWith('data: ')) continue;
        const ev=JSON.parse(line.slice(6));
        if(ev.type==='meta') meta=ev;
        else if(ev.type==='sentence'){ full+=(full?' ':'')+ev.text; el.textContent=prefix+full; if(speak) Voice.push(ev.text); $('log').scrollTop=$('log').scrollHeight; }
        else if(ev.type==='error') log('s','⚠️ 서버의 해설 생성 중 오류가 났어요. 다시 물어봐 주세요.');
      }
    }
    setConn(true);
  }catch(e){
    if(e.name==='AbortError') return;
    if(e.message==='429'){ log('s','⏳ 요청이 너무 많아요. 잠시 후 다시 물어봐 주세요.'); return; }
    log('s','⚠️ 서버 호출 실패('+e.message+') → 샘플 해설로 대신 답합니다.'); setConn(false);
  }finally{ if(speak) Voice.end(); }
  if(my.signal.aborted) return;
  if(!full){   // 서버가 안 되면 샘플 데이터로 대신 답한다
    const pl=plan(q,placeId); full=pl.msg||templateText(pl); el.textContent=prefix+full;
    if(speak) Voice.say(full,{persona});
    meta={mode:pl.mode||'story', place:pl.place||null, follow_ups:null};
  }
  const mode=meta?.mode||'story';
  const turn=[{role:'user',content:q||'이 장소를 이야기해줘'},{role:'assistant',content:full}];
  S.history = mode==='followup' ? S.history.concat(turn) : turn;   // 새 이야기면 맥락 리셋
  if(meta?.place) S.focus=meta.place;
  chips(meta?.follow_ups || (mode==='story' ? SHARED.FOLLOW_UPS.ko.slice(0,3) : SHARED.FOLLOW_UPS.ko.slice(3)));
  draw();
}

function say(t){ if(!$('speak').checked) return Voice.stop(); Voice.say(t,{persona:$('persona').value}); }
function log(cls,t){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=t; const l=$('log'); l.appendChild(d); l.scrollTop=l.scrollHeight; return d; }
function chips(list){
  $('chips').innerHTML='';
  list.forEach(t=>{ const b=document.createElement('button'); b.className='sec chip'; b.textContent=t; b.onclick=()=>ask(t); $('chips').appendChild(b); });
}

// ---------- 이동/자동 안내 ----------
function move(m){ // heading 방향으로 m 미터
  const h=rad(S.heading);
  S.lat += (m*Math.cos(h))/111320; S.lng += (m*Math.sin(h))/(111320*Math.cos(rad(S.lat)));
  afterMove();
}
function turn(a){ S.heading=(S.heading+a+360)%360; afterMove(); }
function afterMove(){
  draw();
  if(!$('auto').checked) return;
  const fresh = nearby().find(p=>p.distance_m<80 && !S.spoken.has(p.id));
  if(fresh && !Voice.speaking() && Date.now()-S.lastTalk>15000){ S.spoken.add(fresh.id); ask(`${DIR[fresh.direction]}에 있는 ${fresh.name} 이야기`, true, fresh.id); }
}

// ---------- 지도 그리기 ----------
const cv=$('map'), ctx=cv.getContext('2d'), SCALE=cv.width/900; // 900m 폭
const toXY=(lat,lng)=>({x:cv.width/2+(lng-ORIGIN.lng)*111320*Math.cos(rad(ORIGIN.lat))*SCALE, y:cv.height/2-(lat-ORIGIN.lat)*111320*SCALE});
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const me=toXY(S.lat,S.lng);
  ctx.strokeStyle=css('--line'); ctx.lineWidth=1;
  for(const r of [80,S.radius]){ ctx.setLineDash(r===80?[4,6]:[]); ctx.beginPath(); ctx.arc(me.x,me.y,r*SCALE,0,7); ctx.stroke(); }
  ctx.setLineDash([]);
  // 4방향 섹터(정면 ±45°) 표시
  const h=rad(S.heading-90);
  ctx.fillStyle='rgba(193,68,14,.12)'; ctx.beginPath(); ctx.moveTo(me.x,me.y);
  ctx.arc(me.x,me.y,S.radius*SCALE,h-Math.PI/4,h+Math.PI/4); ctx.fill();
  ctx.font='bold 20px system-ui'; ctx.textAlign='center'; ctx.lineJoin='round'; ctx.lineWidth=5;
  const near=nearby(), ids=new Set(near.map(n=>n.id));
  for(const p of PLACES){
    const q=toXY(p.lat,p.lng), n=near.find(x=>x.id===p.id), out=!ids.has(p.id);
    ctx.fillStyle=out?css('--muted'):css('--accent'); ctx.beginPath(); ctx.arc(q.x,q.y,8,0,7); ctx.fill();
    const label=p.name+(n?` ${n.distance_m}m`:''), lx=Math.min(Math.max(q.x,110),cv.width-110), ly=q.y+(p.id==='meta_sudans'?28:-14);
    ctx.strokeStyle=css('--card'); ctx.strokeText(label,lx,ly); ctx.fillStyle=out?css('--muted'):css('--fg'); ctx.fillText(label,lx,ly);
  }
  // 나(삼각형, heading 방향)
  ctx.save(); ctx.translate(me.x,me.y); ctx.rotate(rad(S.heading)); ctx.fillStyle='#2b6cb0';
  ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(11,12); ctx.lineTo(-11,12); ctx.closePath(); ctx.fill(); ctx.restore();
  $('state').textContent=`방향 ${Math.round(S.heading)}° (북=0°, 동=90°) · 주변: `+(near.map(n=>`${DIR[n.direction]} ${n.name}`).join(', ')||'없음');
}
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*cv.width/r.width, y=(e.clientY-r.top)*cv.height/r.height;
  S.lng=ORIGIN.lng+(x-cv.width/2)/SCALE/(111320*Math.cos(rad(ORIGIN.lat))); S.lat=ORIGIN.lat-(y-cv.height/2)/SCALE/111320; afterMove();
});

// ---------- UI ----------
$('fw').onclick=()=>move(20); $('bk').onclick=()=>move(-20);
$('tl').onclick=()=>turn(-45); $('tr').onclick=()=>turn(45);
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
$('ask').onclick=()=>{ const v=$('q').value.trim(); if(v){ ask(v); $('q').value=''; } };
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') $('ask').click(); e.stopPropagation(); });
$('mic').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return log('s','이 브라우저는 음성 인식을 지원하지 않아요. 입력창을 쓰세요.');
  const r=new SR(); r.lang='ko-KR'; r.onresult=e=>ask(e.results[0][0].transcript); r.start();
};
addEventListener('keydown',e=>{ const k={ArrowUp:()=>move(20),ArrowDown:()=>move(-20),ArrowLeft:()=>turn(-45),ArrowRight:()=>turn(45)}[e.key]; if(k){e.preventDefault();k();} });
const initial=new URLSearchParams(location.search).get('server') ?? (window.WALKGUIDE_API_BASE || store.get('wg_server'));
$('server').value=initial; setApi(initial);
$('connect').onclick=()=>{ setApi($('server').value); connect(); };
$('server').addEventListener('keydown',e=>{ if(e.key==='Enter') $('connect').click(); });
draw();
log('s','시작: 콜로세움 서쪽에서 동쪽(90°)을 보고 서 있습니다. "앞에 있는 건물 뭐야?"를 눌러 보세요.');
connect();
</script>
